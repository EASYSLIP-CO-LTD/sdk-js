name: Publish

# Runs when a maintainer publishes a GitHub Release whose tag starts with "v".
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest the package
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checks out the tagged commit
      id-token: write # signs the build provenance attestation
      attestations: write # stores the build provenance attestation
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - id: version
        name: Check that the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::the tag ${TAG} does not match the package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build, pack, lint the package and install it in a fresh project
        run: npm run check:package
      - name: Pack the release tarball
        run: |
          mkdir -p package
          npm pack --pack-destination package
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: package/*.tgz
      - name: Keep the attestation next to the tarball
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "${BUNDLE}" package/attestation.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/
          if-no-files-found: error

  npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
      url: https://www.npmjs.com/package/@easyslip/sdk/v/${{ needs.build.outputs.version }}
    permissions:
      id-token: write # npm trusted publishing and npm provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package/
      # Trusted publishing: npm exchanges the workflow's OIDC token, so no npm token is stored.
      - name: Publish
        run: npm publish package/*.tgz --provenance --access public

  release-assets:
    name: Attach the package to the release
    needs: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # uploads the release assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package/
      - name: Upload the tarball and its attestation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG}" package/* --repo "${GITHUB_REPOSITORY}" --clobber

  smoke:
    name: Install the published version on Node.js ${{ matrix.node }}
    needs: [build, npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checks out the offline call script
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Wait until the registry serves the version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if npm view "@easyslip/sdk@${VERSION}" version > /dev/null 2>&1; then exit 0; fi
            echo "attempt ${attempt}: @easyslip/sdk@${VERSION} is not visible yet"
            sleep 10
          done
          echo "::error::@easyslip/sdk@${VERSION} did not appear on the registry"
          exit 1
      - name: Install it in a fresh project, check signatures and make an offline call
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: | # zizmor: ignore[adhoc-packages] installs the version this run just published
          mkdir app
          cp scripts/consumer/offline-call.mjs scripts/consumer/offline-call.cjs app/
          cd app
          echo '{ "name": "consumer", "private": true, "type": "module" }' > package.json
          npm install --no-audit --no-fund "@easyslip/sdk@${VERSION}"
          npm audit signatures
          node offline-call.mjs
          node offline-call.cjs
