name: Release

# One workflow opens the release pull request, creates the GitHub Release when that pull request
# is merged, and publishes the package. Publishing has to live here: a release that release-please
# creates with GITHUB_TOKEN does not start other workflows.
on:
  push:
    branches: [main]
  # Publishes an existing release tag again, for example after a failed publish job. Run it on main.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing release tag to publish, for example v1.0.0
        required: true
        type: string

permissions: {}

# Runs for main one at a time, so release-please never works on a stale state. A run that
# publishes a tag again only waits for runs of the same tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request and GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write # starts CI on the release pull request
      contents: write # creates the release tag and the draft release
      issues: write # creates the release labels
      pull-requests: write # opens and updates the release pull request
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Pushes made with GITHUB_TOKEN start no pull_request runs, but a workflow_dispatch event does,
      # so this runs CI on the release branch and its checks show on the release pull request.
      - name: Run CI on the release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${BRANCH}"

  build:
    name: Build and test the release
    needs: release-please
    # Runs after release-please created a release, or when a maintainer runs the workflow on main.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && needs.release-please.result == 'skipped')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checks out the tagged commit
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || needs.release-please.outputs.sha }}
          fetch-depth: 0 # fetches the tags and main to check the tag below
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - id: tag
        name: Check the tag, its commit and the package.json version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${TAG} is not a release tag such as v1.0.0"
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          if [ "$(git rev-parse "refs/tags/${TAG}^{commit}")" != "${sha}" ]; then
            echo "::error::the checked out commit is not the commit of ${TAG}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${sha}" origin/main; then
            echo "::error::${TAG} is not on main"
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::the tag ${TAG} does not match the package.json version ${version}"
            exit 1
          fi
          {
            echo "tag=${TAG}"
            echo "version=${version}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build, pack, lint the package and install it in a fresh project
        run: npm run check:package
      - name: Pack the release tarball
        run: |
          mkdir -p package
          npm pack --pack-destination package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A push to main and a manual run can publish at the same time otherwise.
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    environment:
      name: release
      url: https://www.npmjs.com/package/@easyslip/sdk/v/${{ needs.build.outputs.version }}
    permissions:
      attestations: write # stores the build provenance attestation
      contents: write # attaches the package to the release and publishes the draft release
      id-token: write # npm trusted publishing, npm provenance and the build attestation
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package/
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: package/*.tgz
      - name: Keep the attestation next to the tarball
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "${BUNDLE}" package/attestation.sigstore.json
      # Trusted publishing: npm exchanges the workflow's OIDC token, so no npm token is stored.
      # npm only trusts this file name (release.yml) in the release environment.
      - name: Publish
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if npm view "@easyslip/sdk@${VERSION}" version > /dev/null 2>&1; then
            echo "@easyslip/sdk@${VERSION} is already on npm, so this run does not publish it again."
          else
            npm publish "package/easyslip-sdk-${VERSION}.tgz" --provenance --access public
          fi
      - name: Attach the tarball and its attestation, then publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if [ "$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = true ]; then
            gh release upload "${TAG}" package/* --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          else
            echo "The release ${TAG} is already published, so its assets stay as they are."
          fi

  smoke:
    name: Install the published version on Node.js ${{ matrix.node }}
    needs: [build, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checks out the offline call script
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Wait until the registry serves the version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if npm view "@easyslip/sdk@${VERSION}" version > /dev/null 2>&1; then exit 0; fi
            echo "attempt ${attempt}: @easyslip/sdk@${VERSION} is not visible yet"
            sleep 10
          done
          echo "::error::@easyslip/sdk@${VERSION} did not appear on the registry"
          exit 1
      - name: Install it in a fresh project, check signatures and make an offline call
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: | # zizmor: ignore[adhoc-packages] installs the version this run just published
          mkdir app
          cp scripts/consumer/offline-call.mjs scripts/consumer/offline-call.cjs app/
          cd app
          echo '{ "name": "consumer", "private": true, "type": "module" }' > package.json
          npm install --no-audit --no-fund "@easyslip/sdk@${VERSION}"
          npm audit signatures
          node offline-call.mjs
          node offline-call.cjs
